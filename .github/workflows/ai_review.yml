name: Revisione AI periodica

on:
  schedule:
    # lunedi mattina, orario decentrato per non affollare lo scheduler di GitHub
    - cron: "13 8 * * 1"
  workflow_dispatch: {}  # permette anche un avvio manuale da GitHub, per test

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Esegui la revisione AI (analisi + raccomandazione, nessuna modifica automatica alla strategia)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEGNALI_API_KEY: ${{ secrets.SEGNALI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python ai_review.py
