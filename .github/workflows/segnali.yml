name: Segnali forex

# GitHub non rispetta con precisione le schedulazioni molto frequenti (ogni
# 15 minuti): un test reale ha mostrato esecuzioni irregolari, circa una
# all'ora invece di 4, con il rischio concreto di perdere segnali (un
# ingresso mean-reversion scoperto un'ora dopo e' ormai inutile, il prezzo
# si e' gia' mosso). Soluzione: un singolo job che resta acceso per ore e
# controlla da solo ogni 15 minuti (loop interno, vedi sotto) - il trigger
# esterno deve solo farlo ripartire ogni tanto, molto meno sensibile ai
# ritardi di GitHub rispetto a un trigger ogni 15 minuti.
on:
  schedule:
    # ogni 3 ore: il loop interno copre ~5h30 ad ogni avvio (vedi sotto),
    # quindi c'e' ampio margine anche se questo trigger arriva in ritardo.
    # Il blocco "concurrency" sotto impedisce pero' che due avvii finiscano
    # per girare INSIEME (visto succedere davvero: piu' run in parallelo
    # che si contendono le stesse chiamate a Twelve Data, causa piu'
    # probabile dei 429 di quanto non sia il semplice burst di 6 richieste).
    - cron: "3 */3 * * *"
  workflow_dispatch: {}  # permette anche un avvio manuale da GitHub, per test

concurrency:
  group: segnali-signal-engine
  cancel-in-progress: false  # non interrompe un run in corso: mette in coda il nuovo trigger, cosi' non gira mai piu' di un run alla volta

jobs:
  run-signal-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # margine di sicurezza sotto il limite di 360 min (6h) di GitHub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Esegui il motore dei segnali in loop, agganciato alla vera chiusura delle candele M15
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEGNALI_API_KEY: ${{ secrets.SEGNALI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Resta acceso ~5h30 (margine sotto il limite di 6h di GitHub) e ad
          # ogni ciclo dorme ESATTAMENTE fino a 2 minuti dopo il prossimo vero
          # confine di barra M15 (00/15/30/45 UTC) - non una sleep fissa, che
          # accumulerebbe uno scarto nel tempo fino a controllare prima ancora
          # che la candela sia chiusa. Il primo ciclo parte subito.
          run_until=$(( $(date -u +%s) + 330 * 60 ))
          i=1
          while [ "$(date -u +%s)" -lt "$run_until" ]; do
            echo "=== Ciclo $i - $(date -u +'%Y-%m-%d %H:%M:%S UTC') ==="
            python signal_engine.py || echo "Ciclo $i fallito: non blocco il loop, riprovo al prossimo giro."

            now=$(date -u +%s)
            next_boundary=$(( ( (now / 900) + 1 ) * 900 + 120 ))
            sleep_for=$(( next_boundary - now ))
            if [ "$(date -u +%s)" -ge "$run_until" ]; then
              break
            fi
            echo "Prossimo controllo tra $sleep_for secondi (alle $(date -u -d "@$next_boundary" +'%H:%M:%S UTC'))"
            sleep "$sleep_for"
            i=$((i + 1))
          done
